services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: artist_growth
      POSTGRES_USER: artist_growth
      POSTGRES_PASSWORD: artist_growth
    ports:
      - "5432:5432"
    volumes:
      - artist_growth_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artist_growth -d artist_growth"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  artist_growth_pg:
