name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: false

      - name: Resolve lockfile for bootstrap proof
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exactly from generated lockfile
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v7
        with:
          name: frontend-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1

  promote-lockfile:
    name: Promote verified lockfile
    needs: frontend
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chore/frontend-reproducibility'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out proof branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Download verified lockfile artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-package-lock
          path: /tmp/frontend-package-lock

      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/frontend-package-lock/package-lock.json
          cp /tmp/frontend-package-lock/package-lock.json apps/web/package-lock.json
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches verified artifact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock frontend dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
